name: Proactive opportunity search

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proactive-opportunity-search
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call protected search runner
        env:
          SYNC_API_TOKEN: ${{ secrets.SYNC_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$SYNC_API_TOKEN" ]]; then
            echo "::warning::Repository secret SYNC_API_TOKEN is not configured; skipping the production call."
            exit 0
          fi

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            --max-time 90 \
            --request POST \
            --header "Authorization: Bearer ${SYNC_API_TOKEN}" \
            --header "Content-Length: 0" \
            https://tailflow.pro/api/internal/proactive-search/run)"

          cat "$response_file"
          printf '\nHTTP %s\n' "$status"

          if [[ "$status" != "200" ]]; then
            echo "Proactive search endpoint returned HTTP $status." >&2
            exit 1
          fi

          node --input-type=commonjs -e '
            let input = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", chunk => input += chunk);
            process.stdin.on("end", () => {
              const result = JSON.parse(input);
              if (result.failed !== 0 || result.locked === true) {
                console.error("Search pass did not complete cleanly:", JSON.stringify({
                  failed: result.failed,
                  locked: result.locked
                }));
                process.exit(1);
              }
            });
          ' < "$response_file"
