name: SharkASP Liciapp bootstrap repair

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: sharkasp-liciapp-bootstrap-repair
  cancel-in-progress: false

jobs:
  replace-bootstrap:
    name: Back up and replace only the Liciapp bootstrap
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Checkout authorized bootstrap and workflow
        uses: actions/checkout@v4

      - name: Locate Web Deploy and install pinned age
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @(
            "$env:ProgramFiles\IIS\Microsoft Web Deploy V3\msdeploy.exe",
            "${env:ProgramFiles(x86)}\IIS\Microsoft Web Deploy V3\msdeploy.exe"
          )
          $msdeploy = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $msdeploy) { throw 'Web Deploy client is unavailable.' }
          $env:GOBIN = Join-Path $env:RUNNER_TEMP 'age-bin'
          New-Item -ItemType Directory -Path $env:GOBIN -Force | Out-Null
          go install filippo.io/age/cmd/age@v1.3.2
          $age = Join-Path $env:GOBIN 'age.exe'
          if (-not (Test-Path -LiteralPath $age)) { throw 'Pinned age tool is unavailable.' }
          $work = Join-Path $env:RUNNER_TEMP ('oportuna-bootstrap-repair-' + $env:GITHUB_RUN_ID)
          New-Item -ItemType Directory -Path $work -Force | Out-Null
          "MSDEPLOY_PATH=$msdeploy" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "AGE_PATH=$age" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "WORK_DIR=$work" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Validate target and corrected bootstrap
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $checkoutSource = Join-Path $env:GITHUB_WORKSPACE 'deploy\sharkasp\sharkasp-bootstrap.mjs'
          if (-not (Test-Path -LiteralPath $checkoutSource -PathType Leaf)) { throw 'Corrected bootstrap is missing.' }
          $expectedBlob = '20a09c3ca5eedbbf461798c42f599c9d95d16859'
          $actualBlob = & git -C $env:GITHUB_WORKSPACE hash-object --path=deploy/sharkasp/sharkasp-bootstrap.mjs $checkoutSource
          if ($LASTEXITCODE -ne 0 -or $actualBlob.Trim() -ne $expectedBlob) { throw 'Bootstrap Git blob does not match the locally validated change.' }
          $text = [System.IO.File]::ReadAllText($checkoutSource)
          if (-not $text.Contains("resolve(appRoot, '..', 'oportuna-private', 'secrets.json')")) { throw 'Corrected sibling secret path is missing.' }
          if ($text.Contains("resolve(appRoot, '..', '..', 'oportuna-private', 'secrets.json')")) { throw 'Old two-level secret path remains.' }
          $source = Join-Path $env:WORK_DIR 'sharkasp-bootstrap.mjs'
          [System.IO.File]::Copy($checkoutSource, $source, $true)
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $source).Hash.ToLowerInvariant()
          & node --check $source
          if ($LASTEXITCODE -ne 0) { throw 'Bootstrap syntax check failed on the deployment runner.' }
          "NEW_BOOTSTRAP_SHA256=$actual" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $site = 'luminiadev-001-site5'
          $siteRoot = 'H:\root\home\luminiadev-001\www\Liciapp'
          $remoteFile = Join-Path $siteRoot 'sharkasp-bootstrap.mjs'
          if ($site -ne 'luminiadev-001-site5' -or $remoteFile -ne 'H:\root\home\luminiadev-001\www\Liciapp\sharkasp-bootstrap.mjs') { throw 'Remote target validation failed.' }
          "SOURCE_FILE=$source" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "REMOTE_FILE=$remoteFile" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Output 'SOURCE_HASH=PASS; SINGLE_FILE_TARGET=PASS; SECRETS_NOT_READ=PASS'

      - name: Back up current remote bootstrap and encrypt it
        shell: pwsh
        env:
          WEBDEPLOY_USERNAME: ${{ secrets.SHARKASP_LICIAPP_WEBDEPLOY_USERNAME }}
          WEBDEPLOY_PASSWORD: ${{ secrets.SHARKASP_LICIAPP_WEBDEPLOY_PASSWORD }}
          AGE_RECIPIENT: ${{ vars.SHARKASP_BACKUP_AGE_RECIPIENT }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:WEBDEPLOY_USERNAME) -or [string]::IsNullOrWhiteSpace($env:WEBDEPLOY_PASSWORD)) { throw 'Web Deploy credentials are unavailable.' }
          if ($env:AGE_RECIPIENT -notmatch '^age1[0-9a-z]+$') { throw 'Encrypted-backup recipient is missing or invalid.' }
          $site = 'luminiadev-001-site5'
          $endpoint = 'https://win1006.site4now.net:8172/MsDeploy.axd?site=luminiadev-001-site5'
          $auth = "computerName=$endpoint,userName=$env:WEBDEPLOY_USERNAME,password=$env:WEBDEPLOY_PASSWORD,authType=Basic"
          $before = Join-Path $env:WORK_DIR 'sharkasp-bootstrap.remote-before.mjs'
          $remoteSource = "contentPath=$env:REMOTE_FILE,$auth"
          $backupOutput = & $env:MSDEPLOY_PATH -verb:sync "-source:$remoteSource" "-dest:filePath=$before" 2>&1 | Out-String
          $backupExit = $LASTEXITCODE
          if ($backupExit -ne 0 -or -not (Test-Path -LiteralPath $before -PathType Leaf)) {
            $code = if ($backupOutput -match '(?i)(ERROR_[A-Z0-9_]+|0x[0-9a-f]{8})') { $Matches[1] } else { 'not-provided' }
            throw "Remote bootstrap backup failed; code=$code. No remote files were changed."
          }
          $oldHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $before).Hash.ToLowerInvariant()
          if ($oldHash -ne 'd72b2efdc9ce70bd7d12f691538570e65677af6c823bd102a0028e15298aacb8') { throw 'Remote bootstrap differs from the preserved pre-deploy version; stopped before writing.' }
          $encrypted = Join-Path $env:WORK_DIR 'sharkasp-bootstrap.remote-before.age'
          & $env:AGE_PATH -r $env:AGE_RECIPIENT -o $encrypted $before
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $encrypted -PathType Leaf)) { throw 'Encrypted bootstrap backup failed; no remote files were changed.' }
          $header = [System.IO.File]::ReadAllBytes($encrypted)
          if ($header.Length -lt 21 -or [System.Text.Encoding]::ASCII.GetString($header, 0, 21) -ne 'age-encryption.org/v1') { throw 'Encrypted backup format check failed.' }
          $newHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $env:SOURCE_FILE).Hash.ToLowerInvariant()
          $manifest = [ordered]@{ site=$site; remote_file='Liciapp/sharkasp-bootstrap.mjs'; previous_sha256=$oldHash; replacement_sha256=$newHash; encrypted='age v1.3.2'; created_utc=[DateTime]::UtcNow.ToString('o') }
          $manifest | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $env:WORK_DIR 'manifest.json') -Encoding utf8
          "PREVIOUS_BOOTSTRAP_SHA256=$oldHash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Output 'REMOTE_BOOTSTRAP_BACKUP=PASS; ENCRYPTED=PASS; REMOTE_CHANGES=none'

      - name: Save encrypted pre-deploy bootstrap backup
        id: backup
        uses: actions/upload-artifact@v4
        with:
          name: sharkasp-bootstrap-before-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/oportuna-bootstrap-repair-${{ github.run_id }}/sharkasp-bootstrap.remote-before.age
            ${{ runner.temp }}/oportuna-bootstrap-repair-${{ github.run_id }}/manifest.json
          if-no-files-found: error
          retention-days: 3

      - name: Record recoverable backup reference
        shell: pwsh
        env:
          BACKUP_ARTIFACT_ID: ${{ steps.backup.outputs.artifact-id }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:BACKUP_ARTIFACT_ID)) { throw 'Encrypted backup artifact ID is missing.' }
          Write-Output "ENCRYPTED_BACKUP_ARTIFACT_ID=$env:BACKUP_ARTIFACT_ID; RETENTION_DAYS=3"

      - name: Dry-run and publish only the bootstrap file
        shell: pwsh
        env:
          WEBDEPLOY_USERNAME: ${{ secrets.SHARKASP_LICIAPP_WEBDEPLOY_USERNAME }}
          WEBDEPLOY_PASSWORD: ${{ secrets.SHARKASP_LICIAPP_WEBDEPLOY_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $endpoint = 'https://win1006.site4now.net:8172/MsDeploy.axd?site=luminiadev-001-site5'
          $auth = "computerName=$endpoint,userName=$env:WEBDEPLOY_USERNAME,password=$env:WEBDEPLOY_PASSWORD,authType=Basic"
          $source = "filePath=$env:SOURCE_FILE"
          $destination = "contentPath=$env:REMOTE_FILE,$auth"
          $plan = & $env:MSDEPLOY_PATH -verb:sync "-source:$source" "-dest:$destination" -whatif 2>&1 | Out-String
          $planExit = $LASTEXITCODE
          if ($planExit -ne 0) {
            $code = if ($plan -match '(?i)(ERROR_[A-Z0-9_]+|0x[0-9a-f]{8})') { $Matches[1] } else { 'not-provided' }
            throw "Single-file Web Deploy dry-run failed; code=$code. No remote files were changed."
          }
          if ($plan -notmatch '(?i)sharkasp-bootstrap\.mjs') { throw 'Dry-run did not identify the authorized bootstrap target; stopped without writing.' }
          if ($plan -match '(?i)(web\.config|oportuna-private|Deleting file|Removing file|DeleteRule)') { throw 'Dry-run included a protected or destructive operation; stopped without writing.' }
          Write-Output 'DRY_RUN=PASS; TARGET=Liciapp/sharkasp-bootstrap.mjs; OTHER_FILES=none; DELETIONS=none'
          $apply = & $env:MSDEPLOY_PATH -verb:sync "-source:$source" "-dest:$destination" 2>&1 | Out-String
          $applyExit = $LASTEXITCODE
          if ($applyExit -ne 0) {
            $code = if ($apply -match '(?i)(ERROR_[A-Z0-9_]+|0x[0-9a-f]{8})') { $Matches[1] } else { 'not-provided' }
            throw "Bootstrap deployment failed; code=$code. The encrypted pre-deploy backup is retained."
          }
          Write-Output 'BOOTSTRAP_DEPLOY=PASS; TARGET=Liciapp/sharkasp-bootstrap.mjs'

      - name: Confirm remote file hash and test public routes
        shell: pwsh
        env:
          WEBDEPLOY_USERNAME: ${{ secrets.SHARKASP_LICIAPP_WEBDEPLOY_USERNAME }}
          WEBDEPLOY_PASSWORD: ${{ secrets.SHARKASP_LICIAPP_WEBDEPLOY_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $endpoint = 'https://win1006.site4now.net:8172/MsDeploy.axd?site=luminiadev-001-site5'
          $auth = "computerName=$endpoint,userName=$env:WEBDEPLOY_USERNAME,password=$env:WEBDEPLOY_PASSWORD,authType=Basic"
          $after = Join-Path $env:WORK_DIR 'sharkasp-bootstrap.remote-after.mjs'
          $remoteSource = "contentPath=$env:REMOTE_FILE,$auth"
          $verifyOutput = & $env:MSDEPLOY_PATH -verb:sync "-source:$remoteSource" "-dest:filePath=$after" 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $after -PathType Leaf)) { throw 'Remote bootstrap hash read failed after deploy; encrypted pre-deploy backup is retained.' }
          $remoteHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $after).Hash.ToLowerInvariant()
          $expectedHash = $env:NEW_BOOTSTRAP_SHA256
          if ($remoteHash -ne $expectedHash) { throw 'Remote bootstrap hash does not match the authorized replacement; encrypted backup is retained.' }
          Write-Output "REMOTE_BOOTSTRAP_SHA256=$remoteHash; MATCH=PASS"
          $urls = @(
            'https://luminiadev-001-site5.ltempurl.com/api/health',
            'https://luminiadev-001-site5.ltempurl.com/'
          )
          $results = @()
          foreach ($url in $urls) {
            try {
              $response = Invoke-WebRequest -Uri $url -Method Get -UseBasicParsing -TimeoutSec 20
              $code = [int]$response.StatusCode
              $detail = ''
              if ($url.EndsWith('/api/health') -and $code -eq 200) {
                try { $health = $response.Content | ConvertFrom-Json; $detail = "; mysql=$($health.mysql)" } catch { $detail = '; health_json=invalid' }
              }
            } catch {
              $response = $_.Exception.Response
              if ($null -ne $response) { $code = [int]$response.StatusCode; $detail = '; response_error' }
              else { $code = 0; $detail = '; timeout_or_transport_error' }
            }
            $results += [pscustomobject]@{ url=$url; status=$code; detail=$detail }
            Write-Output "HTTP $url = $code$detail"
          }
          if (@($results | Where-Object { $_.status -ne 200 }).Count -gt 0) { throw 'Temporary-domain smoke test failed; custom domains were not queried.' }
          Write-Output 'TEMPORARY_DOMAIN_CHECK=PASS'
          foreach ($url in @('https://tailflow.pro/','https://www.tailflow.pro/')) {
            try { $response = Invoke-WebRequest -Uri $url -Method Get -UseBasicParsing -TimeoutSec 20; $code = [int]$response.StatusCode }
            catch { if ($null -ne $_.Exception.Response) { $code = [int]$_.Exception.Response.StatusCode } else { $code = 0 } }
            Write-Output "HTTP $url = $code"
            if ($code -ne 200) { Write-Output 'CUSTOM_DOMAIN_CHECK=FAIL' }
          }

      - name: Remove runner temporary files
        if: always()
        shell: pwsh
        run: |
          $path = Join-Path $env:RUNNER_TEMP ('oportuna-bootstrap-repair-' + $env:GITHUB_RUN_ID)
          if (Test-Path -LiteralPath $path) { Remove-Item -LiteralPath $path -Recurse -Force }
