name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, types, and safe tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: oportuna_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build client and server
        run: npm run build

      - name: Check server types
        run: npm run typecheck

      - name: Run deterministic tests with per-test timeout
        shell: bash
        run: |
          set -euo pipefail
          for test_name in \
            test:script-targets \
            test:runtime \
            test:mysql-diagnostics \
            test:sharkasp-runtime-config \
            test:matching \
            test:search-relevance \
            test:chilean-rut \
            test:listing-status \
            test:email-service \
            test:enrichment-evidence \
            test:mp-transport \
            test:tender-amounts \
            test:sharkasp-smoke
          do
            echo "::group::npm run $test_name"
            timeout --signal=TERM --kill-after=10s 45s npm run "$test_name"
            echo "::endgroup::"
          done

      - name: Prepare isolated email integration schema
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: ''
          DB_NAME: oportuna
        run: node scripts/prepareEmailTestDatabase.mjs

      - name: Exercise registration, verification, reset, and admin SMTP check against loopback only
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: ''
          DB_NAME: oportuna
        run: npm run test:email-failure-local

      - name: Verify account lifecycle and company profile persistence with simulated mail
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: ''
          DB_NAME: oportuna
          EMAIL_TRANSPORT: simulated
        run: npm run test:auth-lifecycle && npm run test:company-profile-validation

      - name: Verify amount persistence in temporary MySQL table
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: ''
          DB_NAME: oportuna_ci
        run: npm run test:tender-amounts:mysql

  verify-railpack-runtime:
    name: Verify Linux build and isolated runtime compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies as Railpack does
        run: npm install --no-audit --no-fund

      - name: Build after the single dependency install
        run: npm run build

      - name: Exercise compiled Express, static assets, health endpoint, and Linux Argon2
        env:
          RAILPACK_CI: 'true'
        run: npm run test:railpack-runtime

      - name: Stage the Linux-built files as the SharkASP IIS deployment would receive them
        shell: bash
        run: |
          site="$RUNNER_TEMP/oportuna-iis-linux-artifact"
          mkdir -p "$site"
          cp -R dist dist-server node_modules package.json sharkasp-bootstrap.mjs "$site/"
          cp web.config "$site/web.config"
          cmp web.config deploy/sharkasp/web.config.production.template
          python3 scripts/validateSharkaspWebConfig.py "$site/web.config"
          python3 server/test/sharkaspWebConfig.unit.py
          test -f "$site/node_modules/argon2/prebuilds/win32-x64/argon2.glibc.node"

      - name: Preserve the exact Linux-built runtime tree for Windows x64 verification
        uses: actions/upload-artifact@v4
        with:
          name: oportuna-iis-runtime-linux-artifact
          path: ${{ runner.temp }}/oportuna-iis-linux-artifact/
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 1
          retention-days: 1

  verify-iis-windows-runtime:
    name: Verify Linux-built artifact under IIS Node contract (Windows x64)
    needs: verify-railpack-runtime
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source test harness
        uses: actions/checkout@v4

      - name: Set up Node.js 22 x64
        uses: actions/setup-node@v4
        with:
          node-version: 22
          architecture: x64

      - name: Download the exact Linux-built deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: oportuna-iis-runtime-linux-artifact
          path: ${{ runner.temp }}/oportuna-iis-linux-artifact

      - name: Reproduce the final site directory and validate HttpPlatformHandler config
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $site = Join-Path $env:RUNNER_TEMP 'oportuna-iis-site'
          New-Item -ItemType Directory -Path $site -Force | Out-Null
          Copy-Item -Path (Join-Path $env:RUNNER_TEMP 'oportuna-iis-linux-artifact\*') -Destination $site -Recurse -Force
          [xml]$config = Get-Content -Raw (Join-Path $site 'web.config')
          $handler = $config.configuration.'system.webServer'.handlers.add
          if ($handler.path -ne '*' -or $handler.verb -ne '*' -or $handler.modules -ne 'httpPlatformHandler') { throw 'web.config does not route requests to HttpPlatformHandler.' }
          $platform = $config.configuration.'system.webServer'.httpPlatform
          if ($platform.processPath -ne 'node' -or $platform.arguments -ne 'sharkasp-bootstrap.mjs') { throw 'web.config does not launch the configured root Node startup file.' }
          if ($platform.startupTimeLimit -ne '60' -or $platform.startupRetryCount -ne '2') { throw 'web.config startup limits do not match the production contract.' }
          $variables = @($platform.environmentVariables.environmentVariable)
          $port = $variables | Where-Object { $_.name -eq 'PORT' } | Select-Object -First 1
          $hostVariable = $variables | Where-Object { $_.name -eq 'HOST' } | Select-Object -First 1
          $nodeEnv = $variables | Where-Object { $_.name -eq 'NODE_ENV' } | Select-Object -First 1
          if ($port.value -ne '%HTTP_PLATFORM_PORT%' -or $hostVariable.value -ne '127.0.0.1' -or $nodeEnv.value -ne 'production') { throw 'web.config does not pass the dynamic port, loopback bind, and production environment expected by IIS.' }
          if ($null -ne $config.configuration.'system.webServer'.rewrite) { throw 'web.config contains rewrite rules that could bypass Node routing.' }
          if (-not (Test-Path -LiteralPath (Join-Path $site 'sharkasp-bootstrap.mjs') -PathType Leaf)) { throw 'Configured bootstrap is absent from the downloaded artifact.' }
          "APPLICATION_ROOT=$site" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Output 'PASS downloaded artifact web.config and HttpPlatformHandler contract.'

      - name: Start the Linux-built package with HTTP_PLATFORM_PORT and smoke the IIS handoff
        shell: pwsh
        run: node server/test/iisRuntime.integration.mjs "$env:APPLICATION_ROOT"
