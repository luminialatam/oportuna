name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, types, and safe tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: oportuna_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build client and server
        run: npm run build

      - name: Check server types
        run: npm run typecheck

      - name: Run deterministic tests with per-test timeout
        shell: bash
        run: |
          set -euo pipefail
          for test_name in \
            test:script-targets \
            test:runtime \
            test:mysql-diagnostics \
            test:sharkasp-runtime-config \
            test:sharkasp-artifact \
            test:matching \
            test:search-relevance \
            test:chilean-rut \
            test:listing-status \
            test:email-service \
            test:enrichment-evidence \
            test:mp-transport \
            test:tender-amounts \
            test:sharkasp-smoke
          do
            echo "::group::npm run $test_name"
            timeout --signal=TERM --kill-after=10s 45s npm run "$test_name"
            echo "::endgroup::"
          done

      - name: Prepare isolated email integration schema
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: ''
          DB_NAME: oportuna
        run: node scripts/prepareEmailTestDatabase.mjs

      - name: Exercise registration, verification, reset, and admin SMTP check against loopback only
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: ''
          DB_NAME: oportuna
        run: npm run test:email-failure-local

      - name: Verify account lifecycle and company profile persistence with simulated mail
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: ''
          DB_NAME: oportuna
          EMAIL_TRANSPORT: simulated
        run: npm run test:auth-lifecycle && npm run test:company-profile-validation

      - name: Verify amount persistence in temporary MySQL table
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: ''
          DB_NAME: oportuna_ci
        run: npm run test:tender-amounts:mysql

  verify-railpack-runtime:
    name: Verify Linux build and isolated runtime compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies as Railpack does
        run: npm install --no-audit --no-fund

      - name: Build after the single dependency install
        run: npm run build

      - name: Exercise compiled Express, static assets, health endpoint, and Linux Argon2
        env:
          RAILPACK_CI: 'true'
        run: npm run test:railpack-runtime

      - name: Stage the Linux-built files as the SharkASP IIS deployment would receive them
        shell: bash
        run: |
          site="$RUNNER_TEMP/oportuna-iis-linux-artifact"
          mkdir -p "$site"
          cp -R dist dist-server node_modules package.json package-lock.json sharkasp-bootstrap.mjs web.config index.html "$site/"
          mkdir -p "$site/deploy/sharkasp"
          cp deploy/sharkasp/sharkasp-runtime-config.mjs "$site/deploy/sharkasp/"
          node scripts/prepareSharkaspDeployRoot.mjs "$site"
          cmp web.config deploy/sharkasp/web.config.production.template
          python3 scripts/validateSharkaspWebConfig.py "$site/web.config"
          python3 server/test/sharkaspWebConfig.unit.py
          test -f "$site/node_modules/argon2/prebuilds/win32-x64/argon2.glibc.node"

      - name: Preserve the exact Linux-built runtime tree for Windows x64 verification
        uses: actions/upload-artifact@v4
        with:
          name: oportuna-iis-runtime-linux-artifact
          path: ${{ runner.temp }}/oportuna-iis-linux-artifact/
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 1
          retention-days: 1

  verify-iis-windows-runtime:
    name: Verify Linux-built artifact under IIS Node contract (Windows x64)
    needs: verify-railpack-runtime
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source test harness
        uses: actions/checkout@v4

      - name: Set up Node.js 22 x64
        uses: actions/setup-node@v4
        with:
          node-version: 22
          architecture: x64

      - name: Download the exact Linux-built deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: oportuna-iis-runtime-linux-artifact
          path: ${{ runner.temp }}/oportuna-iis-linux-artifact

      - name: Reproduce the final site directory and validate HttpPlatformHandler config
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $site = Join-Path $env:RUNNER_TEMP 'oportuna-iis-site'
          New-Item -ItemType Directory -Path $site -Force | Out-Null
          Copy-Item -Path (Join-Path $env:RUNNER_TEMP 'oportuna-iis-linux-artifact\*') -Destination $site -Recurse -Force
          [xml]$config = Get-Content -Raw (Join-Path $site 'web.config')
          $handler = $config.configuration.'system.webServer'.handlers.add
          if ($handler.path -ne '*' -or $handler.verb -ne '*' -or $handler.modules -ne 'httpPlatformHandler') { throw 'web.config does not route requests to HttpPlatformHandler.' }
          $platform = $config.configuration.'system.webServer'.httpPlatform
          if ($platform.processPath -ne 'node' -or $platform.arguments -ne 'sharkasp-bootstrap.mjs') { throw 'web.config does not launch the configured root Node startup file.' }
          if ($platform.startupTimeLimit -ne '60' -or $platform.startupRetryCount -ne '2') { throw 'web.config startup limits do not match the production contract.' }
          $variables = @($platform.environmentVariables.environmentVariable)
          $port = $variables | Where-Object { $_.name -eq 'PORT' } | Select-Object -First 1
          $hostVariable = $variables | Where-Object { $_.name -eq 'HOST' } | Select-Object -First 1
          $nodeEnv = $variables | Where-Object { $_.name -eq 'NODE_ENV' } | Select-Object -First 1
          if ($port.value -ne '%HTTP_PLATFORM_PORT%' -or $hostVariable.value -ne '127.0.0.1' -or $nodeEnv.value -ne 'production') { throw 'web.config does not pass the dynamic port, loopback bind, and production environment expected by IIS.' }
          if ($null -ne $config.configuration.'system.webServer'.rewrite) { throw 'web.config contains rewrite rules that could bypass Node routing.' }
          if (-not (Test-Path -LiteralPath (Join-Path $site 'sharkasp-bootstrap.mjs') -PathType Leaf)) { throw 'Configured bootstrap is absent from the downloaded artifact.' }
          $index = Get-Content -Raw (Join-Path $site 'index.html')
          if ($index -match '/src/main\.tsx|@vite/client') { throw 'Root index.html is Vite source, not the compiled dist artifact.' }
          $assets = [regex]::Matches($index, '(?:src|href)="(/assets/[^"]+)"') | ForEach-Object { $_.Groups[1].Value }
          if (-not ($assets | Where-Object { $_ -match '^/assets/index-[A-Za-z0-9_-]+\.js$' })) { throw 'Root index.html is missing the hashed JavaScript bundle.' }
          if (-not ($assets | Where-Object { $_ -match '^/assets/index-[A-Za-z0-9_-]+\.css$' })) { throw 'Root index.html is missing the hashed CSS bundle.' }
          foreach ($asset in $assets) { if (-not (Test-Path -LiteralPath (Join-Path $site $asset.TrimStart('/')) -PathType Leaf)) { throw "Root index.html references a missing asset: $asset" } }
          "APPLICATION_ROOT=$site" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Output 'PASS downloaded artifact web.config and HttpPlatformHandler contract.'

      - name: Start the Linux-built package with HTTP_PLATFORM_PORT and smoke the IIS handoff
        shell: pwsh
        run: node server/test/iisRuntime.integration.mjs "$env:APPLICATION_ROOT"

  deploy-production:
    name: Deploy validated Oportuna package over FTP
    needs: [verify, verify-railpack-runtime, verify-iis-windows-runtime]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out smoke-test script
        uses: actions/checkout@v4

      - name: Download the exact IIS-verified deployment package
        uses: actions/download-artifact@v4
        with:
          name: oportuna-iis-runtime-linux-artifact
          path: ${{ runner.temp }}/oportuna-iis-linux-artifact

      - name: Validate package and versioned IIS configuration
        shell: bash
        run: |
          set -euo pipefail
          package="$RUNNER_TEMP/oportuna-iis-linux-artifact"
          for required in web.config index.html sharkasp-bootstrap.mjs sharkasp-runtime-config.mjs package.json dist-server/server/src/index.js node_modules/argon2/prebuilds/win32-x64/argon2.glibc.node; do
            test -f "$package/$required" || { echo "Deployment package is missing $required."; exit 1; }
          done
          cmp web.config "$package/web.config"
          python3 scripts/validateSharkaspWebConfig.py "$package/web.config"
          if test -e "$package/.env" || test -e "$package/secrets.json"; then
            echo 'Deployment package contains a private root configuration file.'
            exit 1
          fi
          if grep -Eq '/src/main\.tsx|@vite/client' "$package/index.html"; then
            echo 'Deployment package contains Vite source HTML instead of the compiled frontend.'
            exit 1
          fi
          echo 'PACKAGE_VALIDATION=PASS; WEB_CONFIG_FROM_GIT=PASS; PRIVATE_ROOT_FILES=ABSENT'

      - name: Recycle the IIS Node process for this deployment
        env:
          DEPLOYMENT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          config = Path(os.environ['RUNNER_TEMP']) / 'oportuna-iis-linux-artifact' / 'web.config'
          content = config.read_text(encoding='utf-8')
          marker = f'    <!-- Oportuna deployment {os.environ["DEPLOYMENT_SHA"]} -->'
          if '</configuration>' not in content:
              raise SystemExit('No se pudo marcar web.config para reciclar el proceso IIS.')
          content = content.replace('</configuration>', f'{marker}\n</configuration>', 1)
          config.write_text(content, encoding='utf-8')
          print('IIS deployment marker set; web.config will recycle the Node process after package upload.')
          PY

      - name: Publish only inside the restricted /Liciapp FTP account
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ${{ runner.temp }}/oportuna-iis-linux-artifact/
          server-dir: /
          dangerous-clean-slate: false
          exclude: |
            **/node_modules/**
            **/.env
            **/.env.*
            **/secrets.json

      - name: Verify the public site and database
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if node deploy/sharkasp/smoke-test.mjs https://tailflow.pro; then
              exit 0
            fi
            echo "Post-deploy health check is not ready (attempt $attempt of 12)."
            if [ "$attempt" -lt 12 ]; then sleep 10; fi
          done
          echo 'Production smoke test failed after 12 attempts; inspect the deployment run and site health.'
          exit 1
